<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Angelica · Reserva tu cita</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Studio Angelica" />
    <script>
      // El manifest se elige al cargar (iPhone lo lee en ese momento): desde /admin el ícono abre el panel
      (function () {
        var admin = location.pathname.indexOf('/admin') === 0
        var l = document.createElement('link'); l.rel = 'manifest'
        l.href = admin ? '/manifest-admin.webmanifest' : '/manifest.webmanifest'
        document.head.appendChild(l)
        if (admin) document.querySelector('meta[name=apple-mobile-web-app-title]').setAttribute('content', 'SA Admin')
        // App instalada en un equipo de administración: abrir siempre el panel
        try {
          var standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches
          if (standalone && admin) localStorage.setItem('sa_admin_device', '1')
          if (standalone && location.pathname === '/' && localStorage.getItem('sa_admin_device')) location.replace('/admin')
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Servicios, precios y reservas en línea." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed&family=Libre+Caslon+Display&family=Inter:wght@400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}))</script>
  </body>
</html>
